<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEC Energy - Agent Workspace</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Removed vanilla lucide script, will use lucide-react -->
    <!-- <script src="https://unpkg.com/lucide@latest"></script> -->

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        wec: {
                            blue: '#005596', // Approximate WEC Energy Blue
                            dark: '#003b6d',
                            light: '#e6f0f9',
                            accent: '#f2a900' // Gold/Orange accent
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="bg-slate-50 h-screen overflow-hidden text-slate-800 flex flex-col">

    <!-- Root element for React app -->
    <div id="root" class="h-full flex flex-col"></div>

    <!-- Import Babel standalone plugin for importing modules if needed, or use UMD -->
    <!-- Actually, let's use the UMD build for lucide-react for easier browser usage -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script type="text/babel">
        // Since we are in a browser environment without a bundler, 
        // we can't easily import specific components from lucide-react.
        // However, lucide exposes a global `lucide` object with icon data.
        // We will create a simple wrapper component to render them safely.
        
        const Icon = ({ name, className = "" }) => {
            const iconNode = window.lucide.icons[name];
            
            if (!iconNode) {
                console.warn(`Icon "${name}" not found in Lucide.`);
                return null;
            }

            // Simple parser to convert Lucide's internal format to SVG
            // Format: [tag, attrs, children[]]
            const renderNode = (node, i) => {
                const [tag, attrs, children] = node;
                
                // Convert kebab-case attributes to camelCase for React
                const reactAttrs = {};
                for (const [key, value] of Object.entries(attrs)) {
                    if (key === 'stroke-width') reactAttrs.strokeWidth = value;
                    else if (key === 'stroke-linecap') reactAttrs.strokeLinecap = value;
                    else if (key === 'stroke-linejoin') reactAttrs.strokeLinejoin = value;
                    else if (key === 'class') reactAttrs.className = value;
                    else reactAttrs[key] = value;
                }

                return React.createElement(
                    tag,
                    { ...reactAttrs, key: i },
                    (children || []).map((child, j) => renderNode(child, j))
                );
            };
            
            return (
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    className={`lucide lucide-${name} ${className}`}
                >
                    {iconNode.map((node, i) => renderNode(node, i))}
                </svg>
            );
        };
        
        // --- Shared UI Components ---
        
        const Card = ({ children, className = "" }) => (
            <div className={`bg-white rounded-xl shadow-sm border border-slate-200 ${className}`}>
                {children}
            </div>
        );

        const Badge = ({ children, type = "default" }) => {
            const types = {
                danger: "bg-red-100 text-red-700 border-red-200",
                warning: "bg-yellow-100 text-yellow-800 border-yellow-200",
                success: "bg-green-100 text-green-700 border-green-200",
                info: "bg-blue-100 text-blue-700 border-blue-200",
                default: "bg-slate-100 text-slate-700 border-slate-200"
            };
            return (
                <span className={`px-2.5 py-0.5 rounded-full text-xs font-medium border ${types[type]}`}>
                    {children}
                </span>
            );
        };

        const Button = ({ children, variant = "primary", onClick, className = "" }) => {
            const variants = {
                primary: "bg-wec-blue hover:bg-wec-dark text-white",
                secondary: "bg-slate-100 hover:bg-slate-200 text-slate-700",
                danger: "bg-red-600 hover:bg-red-700 text-white",
                outline: "border-2 border-wec-blue text-wec-blue hover:bg-wec-light"
            };
            return (
                <button 
                    onClick={onClick}
                    className={`px-4 py-2 rounded-lg font-medium transition-colors duration-200 flex items-center justify-center gap-2 ${variants[variant]} ${className}`}
                >
                    {children}
                </button>
            );
        };

        const Header = ({ customerData }) => {
            return (
                <header className="bg-wec-dark text-white shadow-md z-10">
                    <div className="px-6 py-3 flex items-center justify-between">
                        {}
                        {/* Branding & Interaction Info */}
                        <div className="flex items-center gap-6">
                            <div className="flex items-center gap-3 border-r border-slate-600 pr-6">
                                {/* Simulated WEC Logo */}
                                <div className="w-10 h-10 bg-white rounded-md flex items-center justify-center font-bold text-wec-blue text-xl">
                                    W
                                </div>
                                <div>
                                    <h1 className="font-semibold text-lg leading-tight">Agent Workspace</h1>
                                    <p className="text-xs text-slate-300">Powered by Genesys Cloud</p>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-3">
                                <Badge type="info">Inbound Voice</Badge>
                            </div>
                        </div>

                        {/* Customer High-Level Info */}
                        <div className="flex items-center gap-4">
                            <div className="text-right">
                                <p className="font-semibold">{customerData.name}</p>
                                <p className="text-xs text-slate-300">Acct: {customerData.accountNumber}</p>
                            </div>
                            <div className="w-10 h-10 bg-slate-600 rounded-full flex items-center justify-center text-sm font-bold border-2 border-slate-400">
                                {customerData.name.split(' ').map(n => n[0]).join('')}
                            </div>
                        </div>
                    </div>
                </header>
            );
        };

        const Sidebar = ({ currentStep, setStep }) => {
            const steps = [
                { id: 'verification', label: '1. Verification', icon: 'shield-check' },
                { id: 'empathy', label: '2. Empathy & Safety', icon: 'heart-pulse', highlight: true },
                { id: 'medical_cert', label: '3. Medical Certification', icon: 'file-text' },
                { id: 'payment_plan', label: '4. Payment Plan Review', icon: 'credit-card' },
                { id: 'wrap_up', label: '5. Wrap Up', icon: 'check-circle' }
            ];

            return (
                <div className="w-64 bg-white border-r border-slate-200 flex flex-col h-full shadow-sm">
                    {}
                    <div className="p-4 border-b border-slate-100">
                        <h2 className="font-semibold text-slate-700 text-sm uppercase tracking-wider">Call Flow Guide</h2>
                    </div>
                    <nav className="flex-1 overflow-y-auto p-4 space-y-2">
                        {steps.map((step) => {
                            const isActive = currentStep === step.id;
                            return (
                                <button
                                    key={step.id}
                                    onClick={() => setStep(step.id)}
                                    className={`w-full text-left px-4 py-3 rounded-lg flex items-center gap-3 transition-colors ${
                                        isActive 
                                            ? 'bg-wec-light text-wec-blue font-medium shadow-sm border border-wec-blue/20' 
                                            : 'text-slate-600 hover:bg-slate-50'
                                    }`}
                                >
                                    <Icon name={step.icon} className={`w-5 h-5 ${isActive ? 'text-wec-blue' : 'text-slate-400'} ${step.highlight && !isActive ? 'text-red-500' : ''}`} />
                                    <span className="text-sm">{step.label}</span>
                                    {step.highlight && (
                                        <span className="ml-auto w-2 h-2 rounded-full bg-red-500"></span>
                                    )}
                                </button>
                            );
                        })}
                    </nav>
                </div>
            );
        };

        const CustomerContext = ({ data }) => {
            return (
                <Card className="mb-6 border-t-4 border-t-wec-blue">
                    <div className="p-5">
                        {}
                        <h2 className="text-lg font-semibold text-slate-800 mb-4 flex items-center gap-2">
                            <Icon name="User" className="w-5 h-5 text-wec-blue" />
                            Customer Context
                        </h2>
                        
                        <div className="grid grid-cols-2 gap-6">
                            {/* Intent Data from IVR */}
                            <div className="col-span-1 bg-red-50 rounded-lg p-4 border border-red-100">
                                <h3 className="text-sm font-semibold text-red-800 mb-2 flex items-center gap-2">
                                    <Icon name="AlertTriangle" className="w-4 h-4" />
                                    IVR Intent Detected
                                </h3>
                                <p className="text-xs text-slate-600 mb-1">Reason for escalation:</p>
                                <p className="font-medium text-slate-800 text-sm">Concern regarding medical equipment power requirement.</p>
                                <div className="mt-3 flex gap-2">
                                    <Badge type="danger">High Priority</Badge>
                                    <Badge type="warning">Life Support Risk</Badge>
                                </div>
                            </div>

                            {/* Account Details */}
                            <div className="col-span-1">
                                <h3 className="text-sm font-semibold text-slate-500 mb-3 uppercase tracking-wide">Account Details</h3>
                                <ul className="space-y-2 text-sm">
                                    <li className="flex justify-between border-b border-slate-100 pb-1">
                                        <span className="text-slate-500">Status</span>
                                        <span className="font-medium text-yellow-600 flex items-center gap-1">
                                            <Icon name="Clock" className="w-3 h-3" /> Past Due
                                        </span>
                                    </li>
                                    <li className="flex justify-between border-b border-slate-100 pb-1">
                                        <span className="text-slate-500">Outstanding Balance</span>
                                        <span className="font-medium text-red-600">$329.04</span>
                                    </li>
                                    <li className="flex justify-between border-b border-slate-100 pb-1">
                                        <span className="text-slate-500">Previous Bill</span>
                                        <span className="font-medium">$154.20</span>
                                    </li>
                                    <li className="flex justify-between border-b border-slate-100 pb-1">
                                        <span className="text-slate-500">Current Bill</span>
                                        <span className="font-medium">$174.84</span>
                                    </li>
                                    <li className="flex justify-between pb-1">
                                        <span className="text-slate-500">Service Address</span>
                                        <span className="font-medium text-right max-w-[150px] truncate" title="123 Maple Street, Milwaukee, WI 53202">123 Maple St, Milwaukee</span>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </Card>
            );
        };

        const ScriptArea = ({ currentStep, setStep }) => {
            
            const handleNext = (nextStep) => {
                setStep(nextStep);
            };

            const renderScriptContent = () => {
                switch (currentStep) {
                    case 'verification':
                        return (
                            <div className="space-y-6 animate-fade-in">
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-200">
                                    <p className="text-sm text-slate-500 mb-2 font-semibold">SUGGESTED SCRIPT</p>
                                    <p className="text-lg text-slate-800 italic font-medium leading-relaxed">
                                        "Thank you for calling WEC Energy. I see you were working in our automated system to set up a payment plan. I also understand you have concerns regarding a medical device that requires power. <br/><br/>
                                        Before we address that, for your security, am I speaking with <span className="text-wec-blue font-bold">Amelia Walker</span>?"
                                    </p>
                                </div>
                                <div className="space-y-3">
                                    <label className="flex items-center gap-3 p-3 border rounded-lg hover:bg-slate-50 cursor-pointer">
                                        <input type="checkbox" className="w-5 h-5 text-wec-blue rounded border-slate-300 focus:ring-wec-blue" />
                                        <span className="text-slate-700">Yes, verified speaking with account holder</span>
                                    </label>
                                    <label className="flex items-center gap-3 p-3 border rounded-lg hover:bg-slate-50 cursor-pointer">
                                        <input type="checkbox" className="w-5 h-5 text-wec-blue rounded border-slate-300 focus:ring-wec-blue" />
                                        <span className="text-slate-700">Verified service address: <strong>123 Maple Street</strong></span>
                                    </label>
                                </div>
                                <div className="flex justify-end pt-4">
                                    {}
                                    <Button onClick={() => handleNext('empathy')}>Proceed to Next Step <Icon name="ArrowRight" className="w-4 h-4" /></Button>
                                </div>
                            </div>
                        );
                    case 'empathy':
                        return (
                            <div className="space-y-6 animate-fade-in">
                                <div className="bg-red-50 p-5 rounded-lg border-l-4 border-red-500">
                                    {}
                                    <div className="flex items-center gap-2 mb-3">
                                        <Icon name="AlertCircle" className="w-5 h-5 text-red-600" />
                                        <h3 className="font-semibold text-red-800">CRITICAL: Address Medical Need Immediately</h3>
                                    </div>
                                    <p className="text-sm text-slate-500 mb-2 font-semibold mt-4">SUGGESTED SCRIPT</p>
                                    <p className="text-lg text-slate-800 italic font-medium leading-relaxed">
                                        "Ms. Walker, I want to reassure you right away that we take medical needs very seriously. Let's make sure we document this so your service is not interrupted while we figure out your payment plan. <br/><br/>
                                        Can you tell me briefly about the medical equipment that requires electricity?"
                                    </p>
                                </div>
                                
                                <Card className="p-4 bg-white border-yellow-200">
                                    <h4 className="font-medium text-slate-700 mb-3 flex items-center gap-2">
                                        <Icon name="PenTool" className="w-4 h-4" /> Capture Details
                                    </h4>
                                    <textarea 
                                        className="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-wec-blue focus:border-wec-blue outline-none transition-all" 
                                        rows="3" 
                                        placeholder="Note the type of medical equipment mentioned (e.g., Oxygen concentrator, CPAP, refrigerated medication)..."
                                    ></textarea>
                                </Card>

                                <div className="flex justify-between pt-4">
                                    <Button variant="secondary" onClick={() => handleNext('verification')}><Icon name="ArrowLeft" className="w-4 h-4" /> Back</Button>
                                    <Button onClick={() => handleNext('medical_cert')}>Continue to Certification <Icon name="ArrowRight" className="w-4 h-4" /></Button>
                                </div>
                            </div>
                        );
                    case 'medical_cert':
                        return (
                            <div className="space-y-6 animate-fade-in">
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-200">
                                    <p className="text-sm text-slate-500 mb-2 font-semibold">SUGGESTED SCRIPT</p>
                                    <p className="text-lg text-slate-800 italic font-medium leading-relaxed">
                                        "Alright, Ms. Walker. We have confirmed your payment arrangement, and I have placed the 21-day hold on your account for your medical equipment. <br/><br/>
                                        Please remember to have your doctor complete that Medical Certification form and return it to us before the 21 days are up. <br/><br/>
                                        Do you have any other questions for me today?"
                                    </p>
                                </div>

                                <Card className="p-5">
                                    {}
                                    <h4 className="font-semibold text-slate-700 mb-4 flex items-center gap-2">
                                        <Icon name="ListChecks" className="w-5 h-5 text-wec-blue" /> Wrap-up Checklist
                                    </h4>
                                    <div className="space-y-3">
                                        <label className="flex items-center gap-3 p-2 hover:bg-slate-50 rounded cursor-pointer">
                                            <input type="checkbox" defaultChecked className="w-4 h-4 text-wec-blue rounded border-slate-300 focus:ring-wec-blue" />
                                            <span className="text-sm text-slate-700">21-Day Medical Hold Applied</span>
                                        </label>
                                        <label className="flex items-center gap-3 p-2 hover:bg-slate-50 rounded cursor-pointer">
                                            <input type="checkbox" defaultChecked className="w-4 h-4 text-wec-blue rounded border-slate-300 focus:ring-wec-blue" />
                                            <span className="text-sm text-slate-700">Medical Certification Form Sent</span>
                                        </label>
                                        <label className="flex items-center gap-3 p-2 hover:bg-slate-50 rounded cursor-pointer">
                                            <input type="checkbox" defaultChecked className="w-4 h-4 text-wec-blue rounded border-slate-300 focus:ring-wec-blue" />
                                            <span className="text-sm text-slate-700">Payment Arrangement Confirmed</span>
                                        </label>
                                    </div>
                                    
                                    <div className="mt-6 pt-4 border-t border-slate-200">
                                        <label className="block text-sm font-medium text-slate-700 mb-2">Disposition Code</label>
                                        <select defaultValue="Payment Plan + Medical Hold Processed" className="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-wec-blue outline-none">
                                            <option>Select Outcome...</option>
                                            <option>Payment Plan + Medical Hold Processed</option>
                                            <option>Information Provided</option>
                                            <option>Escalated to Supervisor</option>
                                        </select>
                                    </div>
                                </Card>

                                <div className="flex justify-between pt-4">
                                    {}
                                    <Button variant="secondary" onClick={() => handleNext('payment_plan')}><Icon name="ArrowLeft" className="w-4 h-4" /> Back</Button>
                                </div>
                            </div>
                        );
                    default:
                        return <div>Step not found</div>;
                }
            };

            return (
                <div className="flex-1 bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col overflow-hidden">
                    {/* Header of Script Area */}
                    <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                        <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                            <Icon name="MessageSquare" className="text-wec-blue" />
                            Guided Workflow
                        </h2>
                        <span className="text-sm font-medium text-slate-500 bg-slate-200 px-3 py-1 rounded-full">
                            Step {['verification', 'empathy', 'medical_cert', 'payment_plan', 'wrap_up'].indexOf(currentStep) + 1} of 5
                        </span>
                    </div>
                    
                    {/* Content of Script Area */}
                    <div className="p-8 flex-1 overflow-y-auto">
                        {renderScriptContent()}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [currentStep, setCurrentStep] = React.useState('verification');

            const mockCustomerData = {
                name: "Amelia Walker",
                accountNumber: "12345",
                intent: "Medical Equipment Power Concern + Payment Plan",
            };

            return (
                <div className="h-full flex flex-col bg-slate-100">
                    <Header 
                        customerData={mockCustomerData} 
                    />
                    
                    <div className="flex flex-1 overflow-hidden">
                        <Sidebar currentStep={currentStep} setStep={setCurrentStep} />
                        
                        <main className="flex-1 p-6 flex flex-col overflow-hidden gap-6">
                            <CustomerContext data={mockCustomerData} />
                            <ScriptArea currentStep={currentStep} setStep={setCurrentStep} />
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    
    <style>
        /* Simple animation for step transitions */
        .animate-fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body>
</html>
